[package]
name = "openfiat-chain"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bridge to the Solana execution layer (OFS-4300): blockhash sourcing and transaction relay for RPC-connected and gossip-only nodes."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[features]
# Deliberately no network-selection feature. Devnet is the only deployment
# that exists, so `src/programs.rs` pins its ids unconditionally and there
# is nothing to select. A `network-mainnet` feature whose body was a
# `compile_error!` seemed safer but was strictly worse: `cargo` offers no
# way to exclude a feature from `--all-features`, which CI runs, so a
# feature that can only fail to compile fails the build for everyone. With
# no feature at all, a mainnet build cannot be requested in the first
# place. See `src/programs.rs` for how to add one when mainnet exists.
default = []

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-gossip = { path = "../gossip", version = "0.1.0" }
openfiat-storage = { path = "../storage", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
solana-client = "3"
solana-transaction = "3"
solana-hash = "3"
solana-signature = "3"
solana-commitment-config = "3"
solana-pubkey = "4"
bincode = "1.3"
tokio = { version = "1.53.1", features = ["rt", "time", "sync"] }
async-trait = "0.1.91"
serde_json = "1.0.151"
# Only for validate_rpc_endpoint: solana-client panics rather than erroring
# on a non-JSON-RPC response, so the endpoint is probed directly first.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
openfiat-crypto = { version = "0.1.0", path = "../crypto" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
# Only so `programs`' test can re-read programs/devnet-addresses.json, the
# deployment record the pinned ids are transcribed from.
serde_json = "1.0.151"
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
openfiat-network = { path = "../network", version = "0.1.0" }
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
libp2p = { version = "0.56.0", features = ["request-response"] }
