[package]
name = "openfiat-crypto"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cryptographic primitives: signing, hashing, key derivation."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
# Pinned to the same major `ed25519-dalek` itself depends on, so
# `VerifyingKey::to_montgomery`'s `MontgomeryPoint` is the same type this
# crate does ECDH with — `x25519-dalek` 2.x is still on curve25519-dalek
# 4.x and would not typecheck against it.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
openfiat-types = { path = "../types", version = "0.1.0" }
rand = { version = "0.10.2", features = ["std", "std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"
