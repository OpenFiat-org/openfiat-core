[package]
name = "openfiat-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "`openfiat-node` binary: composition root wiring the crates above."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[[bin]]
name = "openfiat-node"
path = "src/main.rs"

[dependencies]
openfiat-rpc = { path = "../rpc", version = "0.1.0" }
openfiat-snapshot = { path = "../snapshot", version = "0.1.0" }
openfiat-api = { path = "../api", version = "0.1.0" }
openfiat-metrics = { path = "../metrics", version = "0.1.0" }
openfiat-database = { path = "../database", version = "0.1.0" }
openfiat-wallet = { path = "../wallet", version = "0.1.0" }
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
openfiat-chain = { path = "../chain", version = "0.1.0" }
openfiat-content = { path = "../content", version = "0.1.0" }
openfiat-network = { path = "../network", version = "0.1.0" }
openfiat-types = { path = "../types", version = "0.1.0" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4.6.4", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
