[package]
name = "openfiat-settlement"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Settlement coordination with the Solana execution layer."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
openfiat-network = { path = "../network", version = "0.1.0" }
openfiat-gossip = { path = "../gossip", version = "0.1.0" }
openfiat-reservations = { path = "../reservations", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
openfiat-storage = { path = "../storage", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Only so tests can build the reservation registry a settlement
# registry requires (OFS-2300 §5a), and a real advertisement for it to
# draw liquidity from.
openfiat-advertisements = { path = "../advertisements", version = "0.1.0" }
openfiat-taxonomy = { path = "../taxonomy", version = "0.1.0" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
libp2p = { version = "0.56.0", features = ["request-response"] }
