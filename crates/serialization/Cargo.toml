[package]
name = "openfiat-serialization"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Canonical serialization/deserialization for wire and storage formats."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde_json = "1.0.147"
