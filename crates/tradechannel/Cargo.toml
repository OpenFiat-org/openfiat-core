[package]
name = "openfiat-tradechannel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The confidential two-party channel attached to a settlement: sealed payment details and trade chat."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
openfiat-network = { path = "../network", version = "0.1.0" }
openfiat-gossip = { path = "../gossip", version = "0.1.0" }
openfiat-settlement = { path = "../settlement", version = "0.1.0" }
openfiat-disputes = { path = "../disputes", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
openfiat-storage = { path = "../storage", version = "0.1.0" }
# The symmetric half of the hybrid scheme (see `crate::key`). Same AEAD,
# same version, as the one `openfiat-crypto`'s sealed box already uses, so
# a node links one ChaCha20-Poly1305 implementation rather than two.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
rand = { version = "0.10.2", features = ["std", "std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
openfiat-reservations = { path = "../reservations", version = "0.1.0" }
# Only so a test can build the reservation registry `SettlementRegistry`
# now requires (OFS-2300 §5a). Nothing in this crate touches either.
openfiat-advertisements = { path = "../advertisements", version = "0.1.0" }
# A real RocksDB, exclusively so `tests/column_families.rs` can prove what
# a `MemoryStore` structurally cannot: that a column family missing from
# the node's open list loses every write in silence.
openfiat-database = { path = "../database", version = "0.1.0" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
libp2p = { version = "0.56.0", features = ["request-response"] }
