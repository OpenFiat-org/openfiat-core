[package]
name = "openfiat-types"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared protocol types: identifiers, addresses, amounts, timestamps."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
bs58 = "0.5"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
