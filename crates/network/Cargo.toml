[package]
name = "openfiat-network"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Transport layer: TCP/QUIC, TLS abstraction, connection management."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
libp2p = { version = "0.56.0", features = ["noise", "quic", "yamux", "tcp", "macros", "tokio", "identify", "ping", "kad", "request-response"] }
multihash = "0.19"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
async-trait = "0.1.91"
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
libp2p-stream = "0.4.0-alpha"
tracing = "0.1"
