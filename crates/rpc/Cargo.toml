[package]
name = "openfiat-rpc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "JSON-RPC / WebSocket server surface, Solana-style method commands."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
openfiat-network = { path = "../network", version = "0.1.0" }
openfiat-gossip = { path = "../gossip", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
openfiat-storage = { path = "../storage", version = "0.1.0" }
openfiat-advertisements = { path = "../advertisements", version = "0.1.0" }
openfiat-reservations = { path = "../reservations", version = "0.1.0" }
openfiat-settlement = { path = "../settlement", version = "0.1.0" }
openfiat-trade = { path = "../trade", version = "0.1.0" }
openfiat-disputes = { path = "../disputes", version = "0.1.0" }
openfiat-content = { path = "../content", version = "0.1.0" }
openfiat-identity = { path = "../identity", version = "0.1.0" }
openfiat-reputation = { path = "../reputation", version = "0.1.0" }
openfiat-rewards = { path = "../rewards", version = "0.1.0" }
openfiat-governance = { path = "../governance", version = "0.1.0" }
openfiat-registry = { path = "../registry", version = "0.1.0" }
openfiat-notifications = { path = "../notifications", version = "0.1.0" }
openfiat-oracles = { path = "../oracles", version = "0.1.0" }
openfiat-risk = { path = "../risk", version = "0.1.0" }
openfiat-snapshot = { path = "../snapshot", version = "0.1.0" }
openfiat-sessions = { path = "../sessions", version = "0.1.0" }
openfiat-chain = { path = "../chain", version = "0.1.0" }
openfiat-metrics = { path = "../metrics", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
# The snapshot download client the actor bootstraps with; rustls-only, to
# match `openfiat-notifications` and keep one TLS stack in the workspace.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1.44"
libp2p-stream = "0.4.0-alpha"
libp2p-identity = "0.2"
openfiat-discovery = { version = "0.1.0", path = "../discovery" }

[dev-dependencies]
async-trait = "0.1.91"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false }
# Only to build a real (if minimal) VersionedTransaction fixture for
# poll_chain's confirmation-tracking test — ChainState's own validation
# rejects arbitrary bytes, matching OFS-4300 §7.
solana-transaction = "3"
solana-message = "3"
solana-keypair = "3"
solana-hash = "3"
solana-signer = "3"
bincode = "1.3"
