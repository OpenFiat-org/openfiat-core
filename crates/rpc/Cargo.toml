[package]
name = "openfiat-rpc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "JSON-RPC / gRPC / WebSocket server surface."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
