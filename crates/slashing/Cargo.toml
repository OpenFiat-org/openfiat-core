[package]
name = "openfiat-slashing"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Arbitrator slash relay (OFS-2400 §328, OFS-4200 §1): which arbitrators revealed against a resolved dispute's consensus, and must therefore be slashed."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-types = { path = "../types", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
