[package]
name = "openfiat-content"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Attachments and avatars addressed by IPFS CID: validated content identifiers and the signed records that reference them."
repository = "https://github.com/OpenFiat-org/openfiat-core"

[dependencies]
openfiat-crypto = { path = "../crypto", version = "0.1.0" }
openfiat-types = { path = "../types", version = "0.1.0" }
openfiat-network = { path = "../network", version = "0.1.0" }
openfiat-gossip = { path = "../gossip", version = "0.1.0" }
openfiat-settlement = { path = "../settlement", version = "0.1.0" }
openfiat-serialization = { path = "../serialization", version = "0.1.0" }
openfiat-storage = { path = "../storage", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
async-trait = "0.1.91"
# Only for `kubo`: talking to an operator's own IPFS daemon. Matches the
# feature set `openfiat-chain` already pins, so no second TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
libp2p = { version = "0.56.0", features = ["request-response"] }
