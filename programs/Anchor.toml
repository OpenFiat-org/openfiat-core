[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
presale = "7KaEpDzZuqye1xqqp3RnvBJXnDxbU3W9zVrUr5vBS2fU"
# Deterministic swap-aggregator test fixture (see programs/mock-jupiter) —
# localnet/CI only, never deployed to devnet or referenced by production
# SaleConfig.swap_program values.
mock_jupiter = "8ysRdUzhhvm4jHJwbJqYF6ZuS2AqekfTJbxMUF1g3Ugn"
escrow = "CYdn27x69hQ8WBxBeWRGpr9c8B4dcKj8GvyBn6Sdma9s"
staking = "3MF1nAPiECRAGs36RpQTkLb8CvMZuhcgXv1hGZoXEiid"
governance = "2k71DBDoxM4SUFYGbyMXFiTSUynPuY2CqFUsx3FuarXF"

# Filled in once `anchor deploy --provider.cluster devnet` (or, as here,
# `solana program deploy`) has actually run — same program IDs as localnet
# since they're derived from each program's own target/deploy/*-keypair.json,
# not the cluster. escrow/staking/governance deployed to devnet as part of
# Phase 8 (pulled forward from Phase 9's original schedule — see
# devnet-addresses.json's own "devnet_programs" note).
[programs.devnet]
presale = "7KaEpDzZuqye1xqqp3RnvBJXnDxbU3W9zVrUr5vBS2fU"
escrow = "CYdn27x69hQ8WBxBeWRGpr9c8B4dcKj8GvyBn6Sdma9s"
staking = "3MF1nAPiECRAGs36RpQTkLb8CvMZuhcgXv1hGZoXEiid"
governance = "2k71DBDoxM4SUFYGbyMXFiTSUynPuY2CqFUsx3FuarXF"

[provider]
# Kept as "localnet" (not "devnet") so `anchor test` continues to spin up an
# ephemeral solana-test-validator automatically for fast, deterministic CI
# runs. Actual devnet deployment/testing uses explicit
# `--provider.cluster devnet` on the command line — see programs/README.md.
# This repo/workspace must NEVER point this value at "mainnet-beta".
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Run via `anchor test --validator legacy` (see programs/README.md) — this
# Anchor CLI version (1.1.2) defaults to the `surfpool` validator, which
# isn't installed here; `legacy` uses the standard solana-test-validator.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]
