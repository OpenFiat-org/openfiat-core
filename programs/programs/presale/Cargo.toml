[package]
name = "presale"
version = "0.1.0"
description = "The OPEN token presale program (OFS-4200 §3)."
license = "Apache-2.0"
repository = "https://github.com/OpenFiat-org/openfiat-core"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "presale"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
# Only for the OFS-7100 §12 ban gate's seed + governance program id.
# Presale takes no dependency on `governance` itself: the gate is proof
# of non-existence, so it never deserializes a BanRecord.
openfiat-programs-shared = { path = "../../shared", version = "0.1.0" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
