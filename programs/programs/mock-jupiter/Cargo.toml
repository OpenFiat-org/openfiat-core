[package]
name = "mock-jupiter"
version = "0.1.0"
description = "Deterministic swap-aggregator test fixture, standing in for Jupiter in CI (see presale/src/instructions/contribute_with_swap.rs for why the real integration doesn't need to trust this program's internals)."
license = "Apache-2.0"
repository = "https://github.com/OpenFiat-org/openfiat-core"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_jupiter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
