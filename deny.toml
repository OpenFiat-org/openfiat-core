# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# paste (RUSTSEC-2024-0436, unmaintained): pulled in transitively via
# netlink-packet-core -> if-watch -> libp2p-quic/libp2p-tcp for network
# interface watching. No safe upgrade is available upstream; it's internal
# to libp2p's transport layer, not a direct dependency we can swap out.
ignore = ["RUSTSEC-2024-0436"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
