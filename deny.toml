# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[licenses]
# CDLA-Permissive-2.0: webpki-roots/webpki-root-certs' bundled Mozilla root
# certificate data, pulled in transitively via openfiat-chain's solana-client
# -> reqwest/rustls-platform-verifier for TLS. A permissive data license, not
# copyleft — standard for this exact crate across the Rust TLS ecosystem.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# paste (RUSTSEC-2024-0436, unmaintained): pulled in transitively via
# netlink-packet-core -> if-watch -> libp2p-quic/libp2p-tcp for network
# interface watching. No safe upgrade is available upstream; it's internal
# to libp2p's transport layer, not a direct dependency we can swap out.
#
# bincode 1.3.3 (RUSTSEC-2025-0141, unmaintained): the advisory's own text
# says v1.3.3 is considered complete and there is no safe upgrade. Used by
# openfiat-chain to deserialize a relayed Solana transaction's wire bytes —
# but also, independently, a transitive dependency of solana-account deep
# inside solana-client's own tree (OFS-4300), so it can't be avoided by
# choosing a different encoding in this crate's own code either. Decision
# #3 already rejected bincode for this workspace's *own* wire format for
# the same reason; this is Solana's own ecosystem choice, not ours.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2025-0141"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
