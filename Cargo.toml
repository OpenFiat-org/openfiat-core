[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/serialization",
    "crates/crypto",
    "crates/config",
    "crates/storage",
    "crates/database",
    "crates/network",
    "crates/discovery",
    "crates/gossip",
    "crates/snapshot",
    "crates/sessions",
    "crates/registry",
    "crates/swqos",
    "crates/identity",
    "crates/wallet",
    "crates/reputation",
    "crates/reviews",
    "crates/taxonomy",
    "crates/rewards",
    "crates/slashing",
    "crates/trade",
    "crates/advertisements",
    "crates/reservations",
    "crates/settlement",
    "crates/content",
    "crates/disputes",
    "crates/tradechannel",
    "crates/governance",
    "crates/notifications",
    "crates/oracles",
    "crates/risk",
    "crates/chain",
    "crates/rpc",
    "crates/api",
    "crates/metrics",
    "crates/cli",
    "crates/conformance",
