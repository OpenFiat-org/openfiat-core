[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/serialization",
    "crates/crypto",
    "crates/config",
    "crates/storage",
    "crates/database",
    "crates/network",
    "crates/discovery",
    "crates/gossip",
    "crates/snapshot",
    "crates/sessions",
    "crates/registry",
    "crates/swqos",
    "crates/identity",
    "crates/wallet",
    "crates/reputation",
    "crates/reviews",
    "crates/taxonomy",
    "crates/rewards",
    "crates/slashing",
    "crates/trade",
    "crates/advertisements",
    "crates/reservations",
    "crates/settlement",
    "crates/content",
    "crates/disputes",
    "crates/tradechannel",
    "crates/governance",
    "crates/notifications",
    "crates/oracles",
    "crates/risk",
    "crates/chain",
    "crates/rpc",
    "crates/api",
    "crates/metrics",
    "crates/cli",
    "crates/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OpenFiat-org/openfiat-core"

[profile.release]
lto = true
codegen-units = 1
# Matches the on-chain programs workspace, which sets this deliberately.
# Money arithmetic in this workspace is written with `checked_*`, so this
# changes no current behaviour — it is the floor that makes a *future*
# unchecked path abort in release rather than wrap silently, the way debug
# already would. A wrapped balance is a fund-accounting bug that does not
# announce itself; an abort does.
overflow-checks = true
