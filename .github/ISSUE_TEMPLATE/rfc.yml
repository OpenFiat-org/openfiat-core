name: RFC
description: Propose a substantial protocol or architectural change
labels: ["rfc", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph explanation of the proposal.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this change needed? What use cases does it support?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Detailed design
      description: Explain the design in enough detail for implementation and review.
    validations:
      required: true
  - type: textarea
    id: drawbacks
    attributes:
      label: Drawbacks
  - type: textarea
    id: alternatives
    attributes:
      label: Rationale and alternatives
  - type: textarea
    id: unresolved
    attributes:
      label: Unresolved questions
