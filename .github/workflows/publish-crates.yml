name: Publish crates

# Publishes the off-chain protocol crates to crates.io, in dependency order,
# so the Rust SDK (openfiat-sdks) can depend on them by version instead of by
# git rev. Only the crates the SDK's public API needs are published here — the
# node-internal crates (rpc, api, cli, chain, database, ...) stay unpublished.
#
# Driven by a `crates-v*` tag, deliberately distinct from the `v*` tag that
# release.yml uses for node binaries: publishing to crates.io is irreversible
# (a version can never be reused), so it takes its own explicit tag.
#
# The step is idempotent: each crate@version already on crates.io is skipped,
# so a run that fails partway (a flake, a timeout) can simply be re-run.
on:
  push:
    tags: ["crates-v*"]
  workflow_dispatch: {}

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish protocol crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail

          # Dependency order: every crate appears after all of its own
          # openfiat-* dependencies, computed from `cargo metadata`. Publishing
          # out of this order would be rejected by crates.io, which requires a
          # crate's normal dependencies to already exist there.
          crates=(
            openfiat-types
            openfiat-crypto
            openfiat-serialization
            openfiat-network
            openfiat-storage
            openfiat-gossip
            openfiat-taxonomy
            openfiat-advertisements
            openfiat-reservations
            openfiat-settlement
            openfiat-disputes
            openfiat-governance
            openfiat-identity
            openfiat-registry
            openfiat-notifications
            openfiat-oracles
            openfiat-reputation
            openfiat-risk
            openfiat-sessions
            openfiat-snapshot
            openfiat-trade
            openfiat-wallet
          )

          # All crates share the workspace version. If a crates-vX.Y.Z tag
          # fired this run, make sure that is the version actually on disk.
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="openfiat-types"))')"
          echo "workspace version: $version"
          if [[ "${GITHUB_REF_NAME:-}" == crates-v* ]]; then
            tagver="${GITHUB_REF_NAME#crates-v}"
            if [[ "$tagver" != "$version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
              exit 1
            fi
          fi

          on_crates_io() {
            # 200 => this exact version is already published.
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$1/$2" -A 'openfiat-ci')"
            [[ "$code" == "200" ]]
          }

          # Publish one crate, sleeping through crates.io's new-crate rate
          # limit (HTTP 429) rather than failing on it. Publishing 22 brand-new
          # crate names trips that limit after the first few; the server tells
          # us exactly when to retry, so we wait until then and try the same
          # crate again.
          #
          # --no-verify: the crates form an interlocking workspace (their
          # dev-dependencies point at siblings, some of them node-internal
          # crates never published here), so a local verify build would try to
          # resolve dependencies that do not exist on crates.io. The workspace
          # is already built and tested in ci.yml; crates.io still validates
          # every normal dependency server-side on upload.
          publish_one() {
            local crate="$1" out after target now wait attempt
            for attempt in $(seq 1 40); do
              if out="$(cargo publish -p "$crate" --no-verify 2>&1)"; then
                echo "$out"
                return 0
              fi
              echo "$out"
              # A version already uploaded (e.g. index lag vs. our skip check)
              # is success, not failure.
              if grep -qiE "already (exists|uploaded)" <<<"$out"; then
                return 0
              fi
              if grep -qi "429 Too Many Requests" <<<"$out"; then
                after="$(grep -oiP 'try again after \K.*?GMT' <<<"$out" | head -1)"
                now="$(date -u +%s)"
                target="$(date -u -d "$after" +%s 2>/dev/null || echo 0)"
                wait=$(( target - now + 20 ))
                [[ "$wait" -lt 30 ]] && wait=300
                echo ">> rate limited; sleeping ${wait}s (until ${after:-unknown}) then retrying $crate"
                sleep "$wait"
                continue
              fi
              echo ">> $crate failed for a non-rate-limit reason" >&2
              return 1
            done
            echo ">> gave up on $crate after $attempt attempts" >&2
            return 1
          }

          for crate in "${crates[@]}"; do
            if on_crates_io "$crate" "$version"; then
              echo "== $crate@$version already on crates.io, skipping"
              continue
            fi
            echo "== publishing $crate@$version"
            publish_one "$crate"
            # Wait for the index to catch up before the next crate, which may
            # depend on this one. cargo publish already blocks on this, but a
            # crates.io read confirms it rather than trusting the timeout.
            for _ in $(seq 1 30); do
              on_crates_io "$crate" "$version" && break
              sleep 4
            done
          done
          echo "all crates published."
