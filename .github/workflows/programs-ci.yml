name: Programs CI

on:
  push:
    branches: ["main"]
    paths: ["programs/**", ".github/workflows/programs-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["programs/**", ".github/workflows/programs-ci.yml"]

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: stable
  ANCHOR_VERSION: 1.1.2

# Minimal token: CI only reads the repo (F-07).
permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt (programs/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (programs/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs -> target"
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: cargo deny (programs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: programs/Cargo.toml

  anchor-build-test:
    name: anchor build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Set devnet-only Solana config (defense in depth)
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana config set --url https://api.devnet.solana.com
          solana-keygen new --no-bip39-passphrase -o "$HOME/.config/solana/id.json"
      - name: Install Anchor CLI
        # RUSTUP_TOOLCHAIN=stable overrides the rust-toolchain.toml pin in
        # this directory (1.89.0, chosen for on-chain/SBF build
        # reproducibility) — building the anchor-cli *host* binary itself
        # needs a newer rustc than that pin provides.
        run: RUSTUP_TOOLCHAIN=stable cargo install anchor-cli --version ${ANCHOR_VERSION} --locked
      - run: npm install
      # `cargo build-sbf` reports an SBF stack-frame overflow as a non-fatal
      # `Error:` line and still emits a working-looking binary. That binary
      # then dies at runtime with "Access violation ... at address 0x0",
      # attributed to whatever code path happens to run — not to the account
      # that pushed the frame over. It cost a 30-minute test cycle and a
      # wrong hypothesis to trace once; the build already knew.
      #
      # Anchor's own exit code cannot be relied on here, so the log is
      # inspected directly.
      #
      # Two traps for anyone reproducing this locally, both found the hard
      # way after a real overflow reached a devnet deploy:
      #
      #   1. A CACHED BUILD RE-EMITS NOTHING. If the crate does not
      #      recompile, the backend never re-runs the check and the log
      #      says only "Finished". Grepping that is grepping silence.
      #      Confirm you see `Compiling` for the crate you changed —
      #      `touch` the source to force it — before believing a clean
      #      grep. CI is safe from this because it builds from scratch;
      #      your laptop is not.
      #
      #   2. `cargo build-sbf` ALONE REPORTS NOTHING. On the
      #      platform-tools version this workspace resolves to, only
      #      `anchor build` surfaces the diagnostic. A developer checking
      #      their work with the lower-level command gets a false
      #      all-clear on a binary that will die at runtime. That is why
      #      this step shells out to `anchor build` and not to
      #      `cargo build-sbf`.
      - name: anchor build, failing on an SBF stack-frame overflow
        run: |
          set -o pipefail
          anchor build 2>&1 | tee /tmp/anchor-build.log
          # Two different wordings, because the toolchain emits either one
          # depending on how it noticed. This guard originally matched only
          # "overwrites values in the frame" and a real overflow slipped
          # past it: `RecoverStakeShortfall::try_accounts` exceeded the
          # frame by 8 bytes and reported "Stack offset of 4104 exceeded
          # max offset of 4096", which that pattern does not match. The
          # build exited 0 and produced a working-looking `staking.so`.
          # Match on the union, and keep matching on the union — a guard
          # that only catches the phrasing you happened to see once is the
          # same as no guard the first time the wording changes.
          if grep -qE "overwrites values in the frame|exceeded max offset" /tmp/anchor-build.log; then
            echo "::error::SBF stack-frame overflow — a function's locals exceed the 4 KB frame."
            echo "Box the accounts in the offending Accounts struct, or split the instruction."
            grep -oE "in method [^ ]*|Function [^ ]*" /tmp/anchor-build.log | sort -u
            exit 1
          fi
      # One ledger, one glob. `tests-isolated/` existed because the
      # stake-recovery relay needs staking and the arbitration pool
      # denominated in ONE mint (OFS-4100 §4, §6) while
      # `tests/shared-fixtures.ts` staked the settlement mint — an
      # init-once disagreement no spec file could write around. The fixture
      # is correct now, the relay runs in this glob with everything else,
      # and a second ledger would only be a second thing to forget to run.
      #
      # If a spec ever again needs an init-once singleton parameter that
      # differs from the fixture's, it needs its own ledger AND its own CI
      # step here — a suite nothing invokes is this codebase's most
      # frequent defect. See `programs/README.md`.
      #
      # --validator legacy: this Anchor CLI version defaults to the
      # `surfpool` validator, which isn't installed in CI; `legacy` uses the
      # standard solana-test-validator that ships with the Solana CLI.
      - run: anchor test --validator legacy

  no-mainnet-check:
    name: guard against accidental mainnet references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if mainnet-beta is used as a live config value anywhere in programs/
        run: |
          # Matches actual usage (a cluster value or RPC URL), not prose
          # warning against it in comments/docs/README (e.g. this workflow
          # file's own instructions, or Anchor.toml's warning comment) —
          # those legitimately contain the string "mainnet-beta" as text.
          if grep -rInE '(cluster[[:space:]]*=[[:space:]]*"mainnet-beta"|api\.mainnet-beta\.solana\.com)' programs/ \
              --include="*.toml" --include="*.ts" --include="*.rs" --include="*.json" 2>/dev/null \
              | grep -v "programs/target/"; then
            echo "::error::Found a live mainnet-beta config value under programs/ — this workspace must stay devnet-only until the audit gate clears (see OFS-4200 §Status Banner)."
            exit 1
          fi
          echo "No mainnet-beta config values found."
