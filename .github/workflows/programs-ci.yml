name: Programs CI

on:
  push:
    branches: ["main"]
    paths: ["programs/**", ".github/workflows/programs-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["programs/**", ".github/workflows/programs-ci.yml"]

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: stable
  ANCHOR_VERSION: 1.1.2

jobs:
  fmt:
    name: cargo fmt (programs/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (programs/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs -> target"
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: cargo deny (programs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: programs/Cargo.toml

  anchor-build-test:
    name: anchor build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "programs -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Set devnet-only Solana config (defense in depth)
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana config set --url https://api.devnet.solana.com
          solana-keygen new --no-bip39-passphrase -o "$HOME/.config/solana/id.json"
      - name: Install Anchor CLI
        # RUSTUP_TOOLCHAIN=stable overrides the rust-toolchain.toml pin in
        # this directory (1.89.0, chosen for on-chain/SBF build
        # reproducibility) — building the anchor-cli *host* binary itself
        # needs a newer rustc than that pin provides.
        run: RUSTUP_TOOLCHAIN=stable cargo install anchor-cli --version ${ANCHOR_VERSION} --locked
      - run: npm install
      # `cargo build-sbf` reports an SBF stack-frame overflow as a non-fatal
      # `Error:` line and still emits a working-looking binary. That binary
      # then dies at runtime with "Access violation ... at address 0x0",
      # attributed to whatever code path happens to run — not to the account
      # that pushed the frame over. It cost a 30-minute test cycle and a
      # wrong hypothesis to trace once; the build already knew.
      #
      # Anchor's own exit code cannot be relied on here, so the log is
      # inspected directly.
      - name: anchor build, failing on an SBF stack-frame overflow
        run: |
          set -o pipefail
          anchor build 2>&1 | tee /tmp/anchor-build.log
          if grep -q "overwrites values in the frame" /tmp/anchor-build.log; then
            echo "::error::SBF stack-frame overflow — a function's locals exceed the 4 KB frame."
            echo "Box the accounts in the offending Accounts struct, or split the instruction."
            grep -o "in method [^ ]*" /tmp/anchor-build.log | sort -u
            exit 1
          fi
      # --validator legacy: this Anchor CLI version defaults to the
      # `surfpool` validator, which isn't installed in CI; `legacy` uses the
      # standard solana-test-validator that ships with the Solana CLI.
      - run: anchor test --validator legacy
      # `tests-isolated/` needs staking and the arbitration pool denominated
      # in ONE mint (OFS-4100 §4, §6). Each protocol singleton can only be
      # initialized once per ledger, so that configuration cannot share a
      # ledger with `tests/shared-fixtures.ts` — which is why `anchor test`
      # deliberately does not glob this directory. Without this step the
      # suite exists and nothing runs it, which is the failure mode this
      # codebase has now produced seven times: correct, tested code that no
      # caller reaches. See `programs/README.md`.
      - name: isolated program suites (own ledger)
        run: |
          set -o pipefail
          solana-test-validator --reset --quiet --ledger /tmp/isolated-ledger \
            --bpf-program HaPpM1QYM3dKp3sX7zhEdft9hB6ncu6xfALAbkyQChQP target/deploy/escrow.so \
            --bpf-program HYEXk8XQukBkZbiYB33JyVefQDxqyCpPudad3wBCyYmx target/deploy/staking.so &
          for i in $(seq 1 60); do
            solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1 && break
            sleep 1
          done
          ANCHOR_PROVIDER_URL=http://127.0.0.1:8899 \
          ANCHOR_WALLET="$HOME/.config/solana/id.json" \
            npm run test:isolated

  no-mainnet-check:
    name: guard against accidental mainnet references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if mainnet-beta is used as a live config value anywhere in programs/
        run: |
          # Matches actual usage (a cluster value or RPC URL), not prose
          # warning against it in comments/docs/README (e.g. this workflow
          # file's own instructions, or Anchor.toml's warning comment) —
          # those legitimately contain the string "mainnet-beta" as text.
          if grep -rInE '(cluster[[:space:]]*=[[:space:]]*"mainnet-beta"|api\.mainnet-beta\.solana\.com)' programs/ \
              --include="*.toml" --include="*.ts" --include="*.rs" --include="*.json" 2>/dev/null \
              | grep -v "programs/target/"; then
            echo "::error::Found a live mainnet-beta config value under programs/ — this workspace must stay devnet-only until the audit gate clears (see OFS-4200 §Status Banner)."
            exit 1
          fi
          echo "No mainnet-beta config values found."
